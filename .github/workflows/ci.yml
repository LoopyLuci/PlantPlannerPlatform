name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Local pipeline without the browser stage (preflight, typecheck, tests, archive, build)
        run: npm run ci -- --skip e2e
      - name: Regenerate the plain-text archive and verify its checksums
        shell: bash
        run: |
          npm run archive
          cd data/archive && sha256sum -c checksums.sha256

  e2e:
    name: end-to-end journeys (Playwright, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the app, then run the journey tests through the local pipeline
        run: |
          npm run build
          npm run ci -- --only e2e
      - name: Keep the trace of any failed journey
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  kill-test:
    name: process-kill test (1,000 kills)
    # The full kill test is slow (about 4 minutes), so it runs nightly and on demand, not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run kill-test -- --iterations 1000
